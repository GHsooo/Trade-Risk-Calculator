<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Risk Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17253b;font:16px system-ui,sans-serif}main{max-width:760px;margin:35px auto;padding:20px}h1{font-size:28px}h2{font-size:15px;letter-spacing:1px;color:#45607b;margin:0 0 22px}section{background:white;border:1px solid #dce4ee;border-radius:14px;padding:25px;margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:15px 0}.row label{flex:1}input{width:170px;padding:11px;border:1px solid #b8c7d9;border-radius:7px;font:inherit}output{font-variant-numeric:tabular-nums;text-align:right}button{padding:11px 16px;border:0;border-radius:7px;background:#215ac7;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9eff8;color:#21456d}.buttons{display:flex;flex-wrap:wrap;gap:10px}.muted{color:#60748b;font-size:14px}.status{min-height:22px;color:#46637d;font-size:14px}.error{color:#a62d31}#auth input{width:100%;margin:8px 0 16px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.accent{color:#215ac7;font-weight:600}[hidden]{display:none!important}@media(max-width:480px){main{margin:8px auto;padding:12px}section{padding:18px}input{width:125px}.row{gap:10px}h1{font-size:23px}}
</style><link rel="stylesheet" href="./neutral-compact-theme.css"></head><body><main><h1>Trade Risk Calculator</h1><p class="muted">Your account. Your inputs. Your risk plan.</p>
<section id="auth"><h2>SIGN IN OR CREATE AN ACCOUNT</h2><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><div class="buttons"><button type="submit">Sign in</button><button type="button" class="secondary" id="signup">Create account</button><button type="button" class="secondary" id="forgot">Reset password</button></div></form><p id="authMsg" class="status" role="status"></p></section>
<section id="recovery" hidden><h2>SET A NEW PASSWORD</h2><form id="resetForm"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="New password (at least 8 characters)" required><button>Update password</button></form><p id="resetMsg" role="status"></p></section>
<div id="app" hidden><header><span id="account" class="muted"></span><button id="logout" class="secondary">Sign out</button></header><p id="saveMsg" class="status" role="status"></p><div class="buttons"><button id="retry" class="secondary" hidden>Retry</button></div><div id="fields"></div><p id="validation" class="status error" role="status"></p><p class="muted">Long trades only. Whole shares; no leverage assumed. Fees, slippage, gaps and taxes are excluded. A stop order does not guarantee the planned loss.</p></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const client=supabase.createClient('https://fkefwxfuvkogqvgmeqgl.supabase.co','sb_publishable_ff_L2EXjrN0pKc3MGz9-QQ_BgEBLs-X');
const $=id=>document.getElementById(id);
const defaults={risk:'1',buy:'100',stop:'95',target:'1.5',exit:'',principal:'',fx:'7.8'};
let user=null,loaded=false,dirty=false,revision=0,saving=false,timer=null,epoch=0,recovering=false;
const input=(label,id)=>`<div class="row"><label for="${id}">${label}</label><input id="${id}" type="number" step="any" min="0" inputmode="decimal"></div>`;
const out=(label,id,accent=false)=>`<div class="row"><span>${label}</span><output id="${id}" ${accent?'class="accent"':''}>—</output></div>`;
$('fields').innerHTML=`<section><h2>TRADE INPUTS</h2>${input('Risk per trade (%)','risk')}${out('Risk budget / 1R','budget',true)}${input('Buy point, USD','buy')}${input('Stop loss, USD','stop')}${input('Target R-multiple','target')}</section><section><h2>RESULTS</h2>${out('Stop distance','distance')}${out('Risk per share','rps')}${out('Shares to buy','shares',true)}${out('Investment amount','investment')}${out('Portfolio allocation','allocation')}${out('Planned stop loss','loss')}${out('Target price','price')}${out('Potential profit','profit')}${out('Reward-to-risk','rr')}</section><section><h2>TARGET COMPARISON</h2>${out('1.5R target','t15')}${out('2R target','t2')}</section><section><h2>OPTIONAL TRADE RESULT</h2>${input('Exit price, USD','exit')}${out('Profit / loss','pnl')}${out('Achieved R','achieved')}</section><section><h2>PORTFOLIO SETTINGS</h2>${input('Principal in HKD','principal')}${input('HKD per USD','fx')}${out('USD principal','usd',true)}</section>`;
const keys=Object.keys(defaults),outputs=['budget','distance','rps','shares','investment','allocation','loss','price','profit','rr','t15','t2','pnl','achieved','usd'];
const money=n=>'US$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>n.toFixed(2)+'%';
function values(){return Object.fromEntries(keys.map(k=>[k,$(k).value]));}
function setValues(v){keys.forEach(k=>$(k).value=typeof v[k]==='string'||typeof v[k]==='number'?v[k]:defaults[k]);calculate();}
function lock(v){keys.forEach(k=>$(k).disabled=v);}
function calculate(){outputs.forEach(k=>$(k).textContent='—');$('validation').textContent='';const v=values(),n=Object.fromEntries(keys.map(k=>[k,v[k]===''?NaN:Number(v[k])]));const {principal,fx,risk,buy,stop,target}=n;const validPortfolio=principal>0&&fx>0;if(validPortfolio)$('usd').textContent=money(principal/fx);if(validPortfolio&&risk>0&&risk<=100)$('budget').textContent=money(principal/fx*risk/100);if(!(buy>0&&stop>=0&&stop<buy&&target>0)){ $('validation').textContent='For a long trade, buy must be positive, stop must be below buy, and target R must be positive.';return;}const r=buy-stop; $('distance').textContent=pct(r/buy*100);$('rps').textContent=money(r);$('price').textContent=money(buy+target*r);$('t15').textContent=money(buy+1.5*r);$('t2').textContent=money(buy+2*r);$('rr').textContent=target+':1';if(!validPortfolio){$('validation').textContent='Enter your principal and a positive HKD-per-USD exchange rate.';return;}if(!(risk>0&&risk<=100)){ $('validation').textContent='Risk per trade must be greater than 0 and no more than 100%.';return;}const usd=principal/fx,budget=usd*risk/100,qty=Math.min(Math.floor(budget/r),Math.floor(usd/buy)),invest=qty*buy,loss=qty*r;$('shares').textContent=qty.toLocaleString('en-US');$('investment').textContent=money(invest);$('allocation').textContent=pct(invest/usd*100);$('loss').textContent=money(loss);$('profit').textContent=money(loss*target);if(Math.floor(budget/r)>Math.floor(usd/buy))$('validation').textContent='Share count capped at available principal (no leverage).';if(Number.isFinite(n.exit)&&n.exit>=0){$('pnl').textContent=money(qty*(n.exit-buy));$('achieved').textContent=loss>0?((n.exit-buy)/r).toFixed(2)+'R':'—';}}
function status(text,bad=false){$('saveMsg').textContent=text;$('saveMsg').classList.toggle('error',bad);}
async function save(){clearTimeout(timer);if(!user||!loaded||!dirty||saving)return;saving=true;const myEpoch=epoch,uid=user.id,rev=revision,data=values();status('Saving…');try{const {error}=await client.from('calculator_settings').upsert({user_id:uid,inputs:data},{onConflict:'user_id'});if(error)throw error;if(myEpoch!==epoch)return;if(rev===revision){dirty=false;status('All inputs saved to your account.');$('retry').hidden=true;}else status('Saving latest changes…');}catch(e){if(myEpoch===epoch){status('Not saved: '+e.message+' Keep this page open and retry.',true);$('retry').hidden=false;return;}}finally{saving=false;}if(myEpoch===epoch&&dirty)timer=setTimeout(save,300);}
async function load(){if(!user)return;const myEpoch=epoch;loaded=false;lock(true);$('retry').hidden=true;status('Loading your saved inputs…');const {data,error}=await client.from('calculator_settings').select('inputs').eq('user_id',user.id).maybeSingle();if(myEpoch!==epoch)return;if(error){status('Unable to load inputs: '+error.message,true);$('retry').hidden=false;return;}setValues({...defaults,...(data?.inputs||{})});loaded=true;lock(false);status(data?'Your saved inputs are loaded.':'Enter your principal once. Changes save automatically.');}
function clearScreen(){clearTimeout(timer);epoch++;user=null;loaded=false;dirty=false;keys.forEach(k=>$(k).value='');outputs.forEach(k=>$(k).textContent='—');$('account').textContent='';$('app').hidden=true;$('auth').hidden=false;status('');}
async function sync(session){if(!session){clearScreen();return;}if(user?.id===session.user.id)return;clearScreen();user=session.user;$('auth').hidden=true;if(recovering)return;$('app').hidden=false;$('account').textContent=user.email;await load();}
keys.forEach(k=>$(k).addEventListener('input',()=>{calculate();if(!loaded)return;dirty=true;revision++;status('Changes pending…');clearTimeout(timer);timer=setTimeout(save,650);}));
$('retry').onclick=()=>loaded?save():load();
async function authAction(fn){const buttons=document.querySelectorAll('#auth button');buttons.forEach(b=>b.disabled=true);$('authMsg').textContent='Please wait…';try{await fn();}catch(e){$('authMsg').textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false);}}
$('loginForm').onsubmit=e=>{e.preventDefault();authAction(async()=>{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';$('authMsg').textContent='';await sync(data.session);});};
const redirect=()=>location.origin+location.pathname;
$('signup').onclick=()=>{if(!$('loginForm').reportValidity())return;authAction(async()=>{const {data,error}=await client.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:redirect()}});if(error)throw error;$('password').value='';$('authMsg').textContent='Check your email to confirm your account, then sign in.';if(data.session)await sync(data.session);});};
$('forgot').onclick=()=>authAction(async()=>{if(!$('email').reportValidity())return;const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:redirect()});if(error)throw error;$('authMsg').textContent='If the account exists, check your email for a password-reset link.';});
$('resetForm').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.updateUser({password:$('newPassword').value});if(error){$('resetMsg').textContent=error.message;return;}$('newPassword').value='';recovering=false;$('recovery').hidden=true;await client.auth.signOut();$('authMsg').textContent='Password updated. Sign in with your new password.';};
$('logout').onclick=async()=>{if(!loaded){await client.auth.signOut();return;}$('logout').disabled=true;await save();while(saving)await new Promise(r=>setTimeout(r,100));if(dirty){status('Your changes are not saved. Retry before signing out.',true);$('logout').disabled=false;return;}const {error}=await client.auth.signOut();if(error)status(error.message,true);$('logout').disabled=false;};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;clearScreen();$('auth').hidden=true;$('recovery').hidden=false;}setTimeout(()=>sync(session),0);});
(async()=>{try{const {data,error}=await client.auth.getSession();if(error)throw error;await sync(data.session);}catch(e){$('authMsg').textContent='Unable to initialise sign-in: '+e.message;}})();
</script></body></html>
